<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>

    <script>
        function suma(n1,n2){
            return n1+n2;
        }
    </script>
</head>
<body>
    <input type="button" onclick="document.write(`Resultado: ${suma(1,2)}`)" value="Suma">
    <p><br>La función utilizada la sentencia <b>return</b> para devolver un valor.</p>
</body>
</html>
