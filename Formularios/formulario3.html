<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <script>
        function calcula(){
            document.datos.respuesta.value = eval(document.datos.entrada.value)
        }
    </script>
</head>
<body>
    <form name="datos" action="formulario3.html">
    Escribre una fórmula matemática, por ejemplo: (2+3)*10
    <input type="text" size="10" name="entrada">
    <input type="button" value="Ejecuta" name="B1"  onclick="calcula()">
    <br><br>
    Respuesta: <input type="text" size="20" name="respuesta">
    <input type="reset" name="B2" value="Reset">
    
    </form>
    
</body>
</html>
